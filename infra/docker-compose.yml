# Development only. Credentials here are for a laptop, never for production.
name: nzila-dev
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: nzila
      POSTGRES_PASSWORD: nzila
      POSTGRES_DB: nzila
    ports: ["5432:5432"]
    volumes: ["./.data/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nzila"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    # 6380 on the host: 6379 is often taken by another Redis on a developer machine (FINDINGS F-10).
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nzila
      MINIO_ROOT_PASSWORD: nzila-dev-only
    ports: ["9000:9000", "9001:9001"]
    volumes: ["./.data/minio:/data"]
